version: '3.8'

services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"  # NATS server port
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: nats_messaging/dockerfile
    command: python -m nats_messaging.main
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - nats
    environment:
      - PYTHONUNBUFFERED=1